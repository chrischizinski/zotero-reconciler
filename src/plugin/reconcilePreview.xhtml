<?xml version="1.0"?>
<!--
  Phase 4 metadata preview (PREVIEW / CONFIRM, §25). Modal. Receives { model, result } via
  window.arguments[0]: renders `model` (ReconcilePreviewModel) and writes the user's answer
  into `result` (ReconcilePreviewResult) before closing. Only offerable rows get a choice,
  and only among the alternatives the model supplied; closing the window any other way
  leaves result.confirmed = false.
-->
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="Compare Copies and Update My Library"
        width="900" height="640"
        onload="init()">
  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css"/>
    <html:link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css"/>
  </linkset>
  <html:style><![CDATA[
    /* flex-basis 0 + min-height 0: the list must shrink to the space left, or it pushes the buttons off-screen. */
    #rows { flex: 1 1 0; min-height: 0; overflow-y: auto; border: 1px solid var(--fill-quinary, #ccc); padding: 4px; background: var(--material-background, white); }
    .row { display: grid; grid-template-columns: 11em 7.5em 1fr; gap: 4px 10px; padding: 6px 4px; border-bottom: 1px solid var(--fill-quinary, #e5e5e5); align-items: start; }
    .row.inert { opacity: 0.6; }
    .field { font-weight: 600; }
    .class { font-size: 0.85em; font-weight: 600; }
    .class.MISSING { color: light-dark(#1a6b2a, #8fd19e); }
    .class.DIFFERENT, .class.CONFLICTING { color: light-dark(#8a4b00, #f2b866); }
    .class.IDENTICAL { color: light-dark(#555, #b0b0b0); }
    .values { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .current { white-space: pre-wrap; overflow-wrap: anywhere; }
    .values select { max-width: 100%; }
    .note { color: light-dark(#555, #b0b0b0); font-size: 0.92em; white-space: pre-wrap; }
    #summary, #sources { white-space: pre-wrap; }
    #sources { color: light-dark(#555, #b0b0b0); font-size: 0.92em; }
  ]]></html:style>
  <script><![CDATA[
    const HTML_NS = "http://www.w3.org/1999/xhtml";
    let args;

    function init() {
      args = window.arguments && window.arguments[0];
      if (!args || !args.model) { window.close(); return; }
      const { model } = args;
      document.getElementById("heading").textContent = model.title;
      document.getElementById("summary").textContent = model.summary;
      document.getElementById("sources").textContent = model.sources.map((s) => `${s.label}: ${s.evidence}`).join("\n");
      const container = document.getElementById("rows");
      for (const row of model.rows) container.appendChild(renderRow(row));
      updateCount();
    }

    function el(tag, className, text) {
      const node = document.createElementNS(HTML_NS, tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderRow(row) {
      const div = el("div", row.offerable ? "row" : "row inert");
      div.appendChild(el("div", "field", row.field));
      div.appendChild(el("div", `class ${row.class}`, row.class));
      const values = el("div", "values");
      values.appendChild(el("div", "current", `My Library: ${row.targetDisplay}`));
      if (row.offerable) {
        const select = el("select");
        select.dataset.field = row.field;
        const keep = el("option", undefined, "Keep My Library value");
        keep.value = "-1";
        select.appendChild(keep);
        for (const choice of row.choices) {
          const option = el("option", undefined, `Use: ${choice.label}`);
          option.value = String(choice.index);
          select.appendChild(option);
        }
        select.value = String(row.defaultChoice);
        select.addEventListener("change", updateCount);
        values.appendChild(select);
      } else {
        for (const choice of row.choices) values.appendChild(el("div", "note", `Other copy: ${choice.label}`));
      }
      for (const note of row.notes) values.appendChild(el("div", "note", note));
      div.appendChild(values);
      return div;
    }

    function selects() {
      return Array.from(document.querySelectorAll("#rows select"));
    }

    function updateCount() {
      const chosen = selects().filter((select) => select.value !== "-1").length;
      const button = document.getElementById("update");
      button.label = chosen === 0 ? "Update My Library" : `Update ${chosen} Field${chosen === 1 ? "" : "s"}`;
      button.disabled = chosen === 0;
    }

    function keepAll() {
      for (const select of selects()) select.value = "-1";
      updateCount();
    }

    function confirmUpdate() {
      const choices = {};
      for (const select of selects()) choices[select.dataset.field] = Number(select.value);
      args.result.choices = choices;
      args.result.confirmed = true;
      window.close();
    }
  ]]></script>
  <vbox flex="1" style="padding: 12px; gap: 8px; min-height: 0;">
    <html:div id="heading" style="font-weight: 700; font-size: 1.1em;"/>
    <html:div id="summary"/>
    <html:div id="sources"/>
    <html:div id="rows" flex="1"/>
    <hbox align="center" style="gap: 12px;">
      <button label="Keep All" oncommand="keepAll()"/>
      <spacer flex="1"/>
      <button label="Cancel" oncommand="window.close()"/>
      <button id="update" label="Update My Library" default="true" oncommand="confirmUpdate()"/>
    </hbox>
  </vbox>
</window>
